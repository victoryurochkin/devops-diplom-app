name: Application CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: cr.yandex/crp15t94ei4mots103d9/devops-diplom-app

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Define image tag
        id: image
        run: |
          set -euo pipefail

          APP_TAG="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APP_TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$APP_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            printf 'Git tag is not a valid Docker tag\n' >&2
            exit 1
          fi

          APP_IMAGE="$IMAGE_REPOSITORY:$APP_TAG"
          printf 'APP_TAG=%s\n' "$APP_TAG" >> "$GITHUB_ENV"
          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" >> "$GITHUB_ENV"
          printf 'image=%s\n' "$APP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$APP_TAG" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$APP_IMAGE" .

      - name: Test image
        run: |
          set -euo pipefail
          bash -n scripts/test-image.sh
          ./scripts/test-image.sh "$APP_IMAGE"

      - name: Login to Yandex Container Registry
        env:
          YC_REGISTRY_PUSHER_KEY: ${{ secrets.YC_REGISTRY_PUSHER_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$YC_REGISTRY_PUSHER_KEY"

          export DOCKER_CONFIG="$RUNNER_TEMP/diplom-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"

          printf '%s' "$YC_REGISTRY_PUSHER_KEY" |
            docker login --username json_key --password-stdin cr.yandex

      - name: Push tested image
        id: publish
        run: |
          set -euo pipefail
          docker push "$APP_IMAGE"

          IMAGE_DIGEST="$(docker image inspect "$APP_IMAGE" \
            --format '{{index .RepoDigests 0}}')"
          [[ "$IMAGE_DIGEST" == "$IMAGE_REPOSITORY@sha256:"* ]]
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          {
            printf 'Published image: %s\n\n' "$APP_IMAGE"
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            docker image inspect "$APP_IMAGE" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/diplom-docker-auth"

  deploy:
    name: Deploy tagged release
    needs: build-test-push
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, Linux, X64, diplom-deploy]
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: diplom-app-deployment
      cancel-in-progress: false
    env:
      KUBECONFIG: /home/diplom-runner/.kube/config
      DEPLOY_IMAGE: ${{ needs.build-test-push.outputs.image_digest }}
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Deploy published image
        run: |
          set -euo pipefail
          test -s "$KUBECONFIG"
          [[ "$DEPLOY_IMAGE" == "$IMAGE_REPOSITORY@sha256:"* ]]
          IMAGE_HASH="${DEPLOY_IMAGE##*@sha256:}"
          [[ "$IMAGE_HASH" =~ ^[0-9a-f]{64}$ ]]

          kubectl --request-timeout=30s -n diplom-app \
            set image deployment/diplom-app "nginx=$DEPLOY_IMAGE"

          kubectl --request-timeout=240s -n diplom-app \
            rollout status deployment/diplom-app --timeout=180s

          CURRENT_IMAGE="$(kubectl --request-timeout=30s \
            -n diplom-app get deployment diplom-app \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="nginx")].image}')"
          [[ "$CURRENT_IMAGE" == "$DEPLOY_IMAGE" ]]

          kubectl --request-timeout=30s \
            -n diplom-app get pods -o wide

      - name: Check public HTTP endpoints
        run: |
          set -euo pipefail

          for worker_ip in 158.160.20.63 81.26.188.103; do
            PAGE="$(curl --noproxy '*' --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "http://$worker_ip/")"
            [[ "$PAGE" == *"DEVOPS DIPLOMA"* ]]
            [[ "$PAGE" == *"Виктор Юрочкин"* ]]

            HEALTH="$(curl --noproxy '*' --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "http://$worker_ip/healthz")"
            [[ "$HEALTH" == "ok" ]]

            printf 'HTTP %s: page and healthz OK\n' "$worker_ip"
          done

          {
            printf 'Release: %s\n\n' "$RELEASE_TAG"
            printf 'Deployed image: %s\n\n' "$DEPLOY_IMAGE"
            printf 'Rollout and HTTP checks passed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
